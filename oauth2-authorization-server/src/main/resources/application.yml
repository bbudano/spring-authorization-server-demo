spring:

  application:
    name: oauth2-authorization-server

  datasource:
    url: jdbc:postgresql://localhost/postgres
    username: postgres
    password: postgres

  sql:
    init:
      mode: always

  cloud:
    vault:
      token: 00000000-0000-0000-0000-000000000000
      scheme: http
      kv:
        enabled: true
  config:
    import: vault://

logging:
  level:
    org.springframework.security: INFO

